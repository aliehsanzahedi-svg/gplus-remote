name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare project and Build
        run: |
          echo "===== Root files ====="
          ls -la

          # ساخت فایل‌های .env که پروژه بهشون نیاز داره
          echo "Creating .env files..."
          touch .env
          touch .env.example
          echo "# Environment variables" > .env.example
          echo "# Environment variables" > .env

          # اگر پروژه داخل پوشه دیگه‌ای بود
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            PROJ=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
            echo "Project found in: $PROJ"
            cd "$PROJ"
            # فایل‌های .env رو هم به پوشه پروژه کپی کن
            cp ../.env . 2>/dev/null || true
            cp ../.env.example . 2>/dev/null || true
          fi

          echo "===== Project files ====="
          ls -la

          # ساخت gradlew اگر نبود
          if [ ! -f "gradlew" ]; then
            echo "Generating gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew

          # بیلد
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
