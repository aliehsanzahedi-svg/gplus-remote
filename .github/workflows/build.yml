name: Build Android APK

on:
  workflow_dispatch:   # فقط دستی اجرا بشه
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Project & Build
        run: |
          echo "===== Listing root files ====="
          ls -la

          # اگر فایل ZIP وجود داشت، استخراج کن
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d extracted
            cd extracted
            # اگر داخل یک پوشه بود واردش شو
            if [ $(ls -1 | wc -l) -eq 1 ]; then
              cd $(ls -1)
            fi
          fi

          echo "===== Looking for project root ====="
          # پیدا کردن پوشه‌ای که settings.gradle یا settings.gradle.kts داره
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJ_DIR="."
          else
            PROJ_DIR=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          fi

          echo "Project directory: $PROJ_DIR"
          cd "$PROJ_DIR"

          echo "===== Files in project root ====="
          ls -la

          # اگر gradlew وجود نداشت، بساز
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew

          # ساخت keystore دیباگ (اگر نیاز باشه)
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # بیلد با تنظیمات headless
          export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true"
          ./gradlew assembleDebug --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g -Djava.awt.headless=true" \
            --stacktrace

      - name: Upload APK
