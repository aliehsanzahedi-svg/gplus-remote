name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Keystore and Build
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -d extracted_project
            cd extracted_project/* 2>/dev/null || cd extracted_project
          fi
          
          PROJ_DIR=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          cd "$PROJ_DIR"
          
          # Create env files
          touch .env .env.example
          cp .env.example ../ 2>/dev/null || true
          cp .env ../ 2>/dev/null || true
          
          # Generate missing debug.keystore automatically
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore ../ 2>/dev/null || true
          
          gradle wrapper
          chmod +x gradlew
          
          # Disable AWT/GUI environment and force KSP headless mode
          export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true -Dkotlin.compiler.execution.strategy=in-process"
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m -Djava.awt.headless=true -Dkotlin.compiler.execution.strategy=in-process"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app/build/outputs/apk/debug/*.apk"
