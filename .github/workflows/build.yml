name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Prepare Environment and Build
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -d extracted_project
            cd extracted_project/* 2>/dev/null || cd extracted_project
          fi
          
          PROJ_DIR=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          cd "$PROJ_DIR"
          
          # Create env files inside project root
          touch .env
          touch .env.example
          cp .env.example ../ 2>/dev/null || true
          cp .env ../ 2>/dev/null || true
          
          gradle wrapper
          chmod +x gradlew
          
          # Pass headless and memory flags to fix KSP AWT NullPointerException
          export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true"
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m -Djava.awt.headless=true"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app/build/outputs/apk/debug/*.apk"
